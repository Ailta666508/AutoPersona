[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopersona-memory"
version = "0.1.0"
description = "Reference runtime for structured personalized memory and proactive clarification"
readme = "README.md"
requires-python = ">=3.10"
maintainers = [
  { name = "Zihan Shen" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Ailta666508/AutoPersona"

[tool.setuptools]
packages = ["autopersona_memory", "autopersona_memory.adapters"]
